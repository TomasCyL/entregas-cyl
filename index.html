  --ok:#5CC48C; --ok-soft:#173326; --warn:#E3B055; --warn-soft:#3A2D15; --bad:#F07565; --bad-soft:#3D1D1A; --info:#9AAED8; --info-soft:#232B3D; --fut:#A99FA5; --fut-soft:#2A2427;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141113; --surface:#1D191B; --surface-2:#221D20; --ink:#EEE8EB; --muted:#A79DA3; --line:#342C30; --line-2:#463B41;
  --accent:#D4A437; --accent-ink:#1A0A10; --accent-soft:#3A2A1A; --kraft:#D4A437; --kraft-soft:#3A2D20; --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --ok:#5CC48C; --ok-soft:#173326; --warn:#E3B055; --warn-soft:#3A2D15; --bad:#F07565; --bad-soft:#3D1D1A; --info:#9AAED8; --info-soft:#232B3D; --fut:#A99FA5; --fut-soft:#2A2427;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
h2{font-size:16px;font-weight:700;margin:0;letter-spacing:.01em}
